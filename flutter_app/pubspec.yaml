name: creditguard_flutter
description: Flutter client for the educational CreditGuard ML prototype.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.2.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dio: ^5.11.1
  get_it: ^9.3.0
  go_router: ^17.5.0
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
